<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion | JUNERA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #244E8A;
      --bg-body: #F3F4F6;
      --bg-card: #FFFFFF;
      --border-subtle: #E2E6EE;
      --text-main: #111827;
      --text-muted: #6B7280;
      --radius-lg: 18px;
      --radius-pill: 999px;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg-body); color:var(--text-main);}
    a { color:inherit; text-decoration:none;}
    .page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:16px;}
    .card { width:100%; max-width:420px; background:var(--bg-card); border-radius:var(--radius-lg); border:1px solid var(--border-subtle); padding:24px 22px 24px; box-shadow:0 20px 40px rgba(15,23,42,0.06);}
    .logo { font-size:1rem; font-weight:700; letter-spacing:0.16em; text-transform:uppercase; color:var(--primary); margin-bottom:12px;}
    h1 { margin:0 0 6px; font-size:1.4rem; color:var(--primary);}
    p { margin:0 0 18px; font-size:0.9rem; color:var(--text-muted);}
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; font-size:0.9rem;}
    .field-label { font-size:0.8rem; color:var(--text-muted);}
    .input { border-radius:8px; border:1px solid var(--border-subtle); padding:7px 9px; font-size:0.9rem; font-family:inherit; background:#fff; width:100%;}
    .actions { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px;}
    .btn { border-radius:var(--radius-pill); padding:8px 16px; font-size:0.85rem; border:1px solid transparent; background:transparent; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;}
    .btn-primary { background:var(--primary); color:#fff;}
    .link { font-size:0.8rem; color:var(--primary);}
    .footer-text { margin-top:16px; font-size:0.8rem; color:var(--text-muted);}
    .footer-links { font-size:0.78rem; color:var(--text-muted); display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="logo">JUNERA</div>
      <h1>Connexion</h1>
      <p>Connectez-vous pour accéder à votre veille réglementaire personnalisée.</p>

      <form id="login-form">
        <div class="field">
          <label class="field-label">E-mail professionnel</label>
          <input class="input" type="email" name="email" placeholder="vous@entreprise.fr" required />
        </div>

        <div class="field">
          <label class="field-label">Mot de passe</label>
          <input class="input" type="password" name="password" placeholder="Votre mot de passe" required />
        </div>

        <div class="actions">
          <a href="#" class="link">Mot de passe oublié ?</a>
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </div>
      </form>

      <div class="footer-text">
        Pas encore de compte ? <a href="pricing.html" class="link">Créer un compte</a><br />
        <a href="index.html" class="link">Retour au site JUNERA</a>
      </div>
    </div>

    <div class="footer-links">
      <a href="mentions-legales.html">Mentions légales</a>
      <a href="cgu.html">CGU</a>
      <a href="cgv.html">CGV</a>
      <a href="politique-confidentialite.html">Politique de confidentialité</a>
    </div>
  </div>

  <script type="module">
    import { loginUser } from './js/api.js';
    
    const form = document.getElementById('loginForm');
    
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
    
      const data = {
        email: form.email.value,
        password: form.password.value
      };
    
      const res = await loginUser(data);
    
      if (res.user) {
        alert("Connexion réussie !");
        window.location.href = 'dashboard.html';
      } else {
        alert(res.message);
      }
    });
    </script>
</body>
</html>
